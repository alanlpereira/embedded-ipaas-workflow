# ============================================================================
# Supabase CLI Project Configuration
# Project: Embedded iPaaS Workflow Engine
# ============================================================================

project_id = "embedded-ipaas-workflow"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_role = "anon"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600

[analytics]
enabled = false

[functions.workflow-worker]
verify_jwt = false

[functions.approve-step]
verify_jwt = false

[functions.workflow-scheduler]
verify_jwt = false
