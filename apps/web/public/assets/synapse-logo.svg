<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="synapse-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#0099ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Synapse Brain Node Network Icon -->
  <g transform="translate(10, 8)">
    <path d="M 32 12 Q 18 24 24 40 T 40 56 Q 52 44 48 28 Z" fill="none" stroke="url(#synapse-cyan)" stroke-width="3" filter="url(#glow)"/>
    <circle cx="24" cy="18" r="5" fill="#00f2fe"/>
    <circle cx="44" cy="22" r="4" fill="#a855f7"/>
    <circle cx="18" cy="38" r="4" fill="#00f2fe"/>
    <circle cx="36" cy="42" r="6" fill="#00f2fe"/>
    <circle cx="48" cy="52" r="5" fill="#0099ff"/>
    <circle cx="28" cy="58" r="4" fill="#00f2fe"/>
    <line x1="24" y1="18" x2="44" y2="22" stroke="#00f2fe" stroke-width="2"/>
    <line x1="24" y1="18" x2="18" y2="38" stroke="#00f2fe" stroke-width="2"/>
    <line x1="44" y1="22" x2="36" y2="42" stroke="#00f2fe" stroke-width="2"/>
    <line x1="18" y1="38" x2="36" y2="42" stroke="#00f2fe" stroke-width="2"/>
    <line x1="36" y1="42" x2="48" y2="52" stroke="#00f2fe" stroke-width="2"/>
    <line x1="36" y1="42" x2="28" y2="58" stroke="#00f2fe" stroke-width="2"/>
  </g>

  <!-- Brand Typography SYNAPSE -->
  <text x="75" y="48" font-family="'Inter', sans-serif" font-weight="900" font-size="30" fill="#f8fafc" letter-spacing="1.5">
    SYNAPSE
  </text>
  <text x="76" y="64" font-family="'Inter', sans-serif" font-weight="800" font-size="10" fill="#00f2fe" letter-spacing="2">
    EMBEDDED iPAAS
  </text>
</svg>
