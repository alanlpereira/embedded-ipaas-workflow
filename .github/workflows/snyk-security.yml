# Workflow do GitHub Actions para Análise Automatizada de Segurança via Snyk
# -----------------------------------------------------------------------------------
# ⚠️ CONFIGURAÇÃO OBRIGATÓRIA PARA INTEGRAÇÃO COM PAINEL SNYK:
# Para enviar relatórios diretamente para o app.snyk.io:
# -> Acesse: GitHub Settings -> Secrets and variables -> Actions -> New repository secret
# -> Nome da Secret: SNYK_TOKEN
# -> Valor: API Key da sua conta no Snyk (https://app.snyk.io/)
# -----------------------------------------------------------------------------------

name: Snyk Security Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1' # Executa semanalmente toda segunda-feira às 03:00 UTC

jobs:
  security-audit:
    name: Snyk Vulnerability & Code SAST Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código-fonte
        uses: actions/checkout@v4

      - name: Configurar ambiente Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Instalar pnpm e Snyk CLI
        run: |
          npm install -g pnpm@8.15.0 snyk

      - name: Instalar dependências do projeto
        run: pnpm install --no-frozen-lockfile

      - name: Executar Varredura de Vulnerabilidades em Dependências (Snyk Test)
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            echo "🔒 [SNYK] Executando análise de dependências pnpm..."
            snyk test --all-projects --package-manager=pnpm --severity-threshold=high || true
          else
            echo "⚠️ [SNYK NOTICE] Secret SNYK_TOKEN não detectada no GitHub Secrets."
            echo "ℹ️ Para vincular varreduras automáticas ao seu painel Snyk, adicione a secret SNYK_TOKEN no GitHub."
          fi

      - name: Executar Varredura SAST no Código-Fonte (Snyk Code Test)
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            echo "🔍 [SNYK] Executando análise de código estático (SAST)..."
            snyk code test --all-projects || true
          else
            echo "⚠️ [SNYK NOTICE] Snyk Code ignorado pois a secret SNYK_TOKEN não foi configurada."
          fi
